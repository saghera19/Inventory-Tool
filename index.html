  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',

  <style>
    @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
    .shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200px 100%; animation: shimmer 1.5s infinite; }
    .dark .shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200px 100%; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
    [x-cloak] { display: none !important; }
  </style>
</head>

        // Generate transactions
        const transactions = [];
        let txnId = 1;
        const now = new Date();
        for (let d = 30; d >= 0; d--) {
          const date = new Date(now);
          date.setDate(date.getDate() - d);
          const dateStr = date.toISOString().split('T')[0];

          if (Math.random() > 0.3) {
            const prod = products[Math.floor(Math.random() * products.length)];
            const suppliers = parties.filter(p => p.type === 'supplier');
            const party = suppliers[Math.floor(Math.random() * suppliers.length)];
            const qty = Math.floor(Math.random() * 30) + 5;
            transactions.push({
              id: txnId++, type: 'received', productId: prod.id, partyId: party.id,
              quantity: qty, pricePerUnit: prod.purchasePrice, totalAmount: qty * prod.purchasePrice,
              date: dateStr, invoiceNumber: `PO-2024${String(d).padStart(3, '0')}`, notes: `Stock from ${party.name}`

          if (Math.random() > 0.25) {

            const customers = parties.filter(p => p.type === 'customer');
            const party = customers[Math.floor(Math.random() * customers.length)];

      getNextId(type) {
        const ids = JSON.parse(localStorage.getItem('sf_nextId')) || { category: 1, product: 1, party: 1, transaction: 1 };
        const id = ids[type];
        ids[type]++;
        localStorage.setItem('sf_nextId', JSON.stringify(ids));
        return id;

        { id: 'customers', label: 'Customers', icon: icons.users, group: 'Parties' }
      ];

      let lastGroup = '';
      const navHtml = navItems.map(item => {
        let groupHtml = '';

          groupHtml = `<p class="text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-3 pt-5 pb-1">${item.group}</p>`;
          lastGroup = item.group;

        return `${groupHtml}
          <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all ${active ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-400' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-200'}">
            ${item.icon}<span>${item.label}</span>
          </button>`;

      return `
        <aside class="fixed lg:sticky top-0 left-0 z-50 h-screen w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col transform transition-transform lg:translate-x-0 ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'}">

              <h2 class="text-lg font-semibold text-gray-900 dark:text-white">${pageLabels[state.page] || 'Dashboard'}</h2>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="${state.dark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}">
              ${state.dark ? icons.sun : icons.moon}
            </button>
          </div>
        </header>
      `;
    }

    function renderDashboard() {
      const products = DB.get('products');
      const transactions = DB.get('transactions');
      const parties = DB.get('parties');

      const totalProducts = products.length;
      const lowStockItems = products.filter(p => p.currentStock <= p.minStockLevel);
      const lowStockCount = lowStockItems.length;
      const inventoryValue = products.reduce((sum, p) => sum + (p.currentStock * p.purchasePrice), 0);

      const now = new Date();
      const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const monthTxns = transactions.filter(t => t.date >= firstOfMonth);
      const monthReceived = monthTxns.filter(t => t.type === 'received').reduce((s, t) => s + t.totalAmount, 0);
      const monthIssued = monthTxns.filter(t => t.type === 'issued').reduce((s, t) => s + t.totalAmount, 0);

      const totalSuppliers = parties.filter(p => p.type === 'supplier').length;

            ${statCard('Inventory Value', fmt(inventoryValue), 'At purchase price', 'bg-green-100 dark:bg-green-900/40', `<svg class="w-5 h-5 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z" /></svg>`)}
            ${statCard('Month Purchases', fmt(monthReceived), `From ${totalSuppliers} suppliers`, 'bg-purple-100 dark:bg-purple-900/40', icons.arrowDown.replace('w-5 h-5', 'w-5 h-5 text-purple-600 dark:text-purple-400'))}
            ${statCard('Month Sales', fmt(monthIssued), `To ${totalCustomers} customers`, 'bg-amber-100 dark:bg-amber-900/40', icons.arrowUp.replace('w-5 h-5', 'w-5 h-5 text-amber-600 dark:text-amber-400'))}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="rounded-xl border p-4 ${lowStockCount > 0 ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800' : 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800'}">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center ${lowStockCount > 0 ? 'bg-red-100 dark:bg-red-900/50' : 'bg-green-100 dark:bg-green-900/50'}">
                  <span class="text-xl">${lowStockCount > 0 ? '⚠️' : '✅'}</span>
                </div>
                <div>
                  <p class="text-2xl font-bold ${lowStockCount > 0 ? 'text-red-700 dark:text-red-400' : 'text-green-700 dark:text-green-400'}">${lowStockCount}</p>
                  <p class="text-sm text-gray-600 dark:text-gray-400">Low Stock Alerts</p>
                </div>
              </div>
            </div>
            <div class="rounded-xl border bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800 p-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center"><span class="text-xl">📦</span></div>
                <div><p class="text-2xl font-bold text-blue-700 dark:text-blue-400">${totalSuppliers}</p><p class="text-sm text-gray-600 dark:text-gray-400">Active Suppliers</p></div>
              </div>
            </div>
            <div class="rounded-xl border bg-orange-50 dark:bg-orange-900/20 border-orange-200 dark:border-orange-800 p-4">

              <div class="divide-y divide-gray-100 dark:divide-gray-800">
                ${recentTxns.length === 0 ? '<div class="p-8 text-center"><p class="text-gray-400 dark:text-gray-500">No transactions yet</p></div>' : recentTxns.map(t => {
                  const prod = products.find(p => p.id === t.productId);

                    <div class="px-5 py-3 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-800/50">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${t.type === 'received' ? 'bg-green-100 dark:bg-green-900/40' : 'bg-orange-100 dark:bg-orange-900/40'}">
                          ${t.type === 'received' ? '<svg class="w-4 h-4 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>' : '<svg class="w-4 h-4 text-orange-600 dark:text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>'}
                        </div>
                        <div class="min-w-0">
                          <p class="text-sm font-medium text-gray-900 dark:text-white truncate">${prod?.name || 'Unknown'}</p>
                          <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${t.type === 'received' ? 'From' : 'To'}: ${party?.name || '—'} · ${t.quantity} qty</p>
                        </div>
                      </div>
                      <div class="text-right flex-shrink-0 ml-3">
                        <p class="text-sm font-semibold ${t.type === 'received' ? 'text-green-600 dark:text-green-400' : 'text-orange-600 dark:text-orange-400'}">${fmt(t.totalAmount)}</p>
                        <p class="text-[11px] text-gray-400">${new Date(t.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })}</p>

              </div>

            <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800">
              <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800"><h3 class="font-semibold text-gray-900 dark:text-white">Low Stock Alerts</h3></div>
              <div class="divide-y divide-gray-100 dark:divide-gray-800">
                ${lowStockItems.length === 0 ? '<div class="p-8 text-center"><p class="text-4xl mb-2">✅</p><p class="text-gray-500 dark:text-gray-400 font-medium">All stock levels are healthy</p><p class="text-sm text-gray-400 dark:text-gray-500">No products below minimum levels</p></div>' : lowStockItems.slice(0, 8).map(item => `
                  <div class="px-5 py-3 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <div class="min-w-0"><p class="text-sm font-medium text-gray-900 dark:text-white truncate">${item.name}</p><p class="text-xs text-gray-500 dark:text-gray-400">SKU: ${item.sku}</p></div>
                    <div class="text-right flex-shrink-0 ml-3"><p class="text-sm font-bold text-red-600 dark:text-red-400">${item.currentStock} ${item.unit}</p><p class="text-[11px] text-gray-400">Min: ${item.minStockLevel}</p></div>
                  </div>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function statCard(title, value, subtitle, colorClass, icon) {
      return `
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-5 hover:shadow-md transition-shadow">
          <div class="flex items-start justify-between">
            <div><p class="text-sm text-gray-500 dark:text-gray-400 font-medium">${title}</p><p class="text-2xl font-bold text-gray-900 dark:text-white mt-1">${value}</p><p class="text-xs text-gray-400 dark:text-gray-500 mt-1">${subtitle}</p></div>
            <div class="w-10 h-10 rounded-lg flex items-center justify-center ${colorClass}">${icon}</div>
          </div>
        </div>`;
    }

      const products = DB.get('products');
      const categories = DB.get('categories');
      const search = state.search.toLowerCase();
      const filtered = products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search);
        const matchCat = !state.catFilter || p.categoryId == state.catFilter;
        return matchSearch && matchCat;
      });

      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div class="flex-1 flex flex-col sm:flex-row gap-3">
              <div class="relative flex-1 max-w-sm">
                ${icons.search.replace('w-4 h-4', 'absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400')}
                <input type="text" placeholder="Search products..." value="${state.search}" oninput="state.search=this.value;render()" class="w-full pl-10 pr-4 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" />

              <select value="${state.catFilter}" onchange="state.catFilter=this.value;render()" class="px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white">
                <option value="">All Categories</option>
                ${categories.map(c => `<option value="${c.id}" ${state.catFilter == c.id ? 'selected' : ''}>${c.name}</option>`).join('')}

          </div>
          ${filtered.length === 0 ? `
            <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-12 text-center">
              <div class="text-5xl mb-4">📦</div>
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">No products found</h3>
              <p class="text-gray-500 dark:text-gray-400 mt-1">${search || state.catFilter ? 'Try adjusting your filters' : 'Get started by adding your first product'}</p>

              <div class="overflow-x-auto">

                    <th class="px-4 py-3 text-left font-semibold text-gray-600 dark:text-gray-400 hidden md:table-cell">Category</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400">Stock</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400 hidden sm:table-cell">Purchase ₹</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400 hidden sm:table-cell">Selling ₹</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400">Actions</th>
                  </tr></thead>
                  <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                    ${filtered.map(p => {
                      const cat = categories.find(c => c.id === p.categoryId);
                      const isLow = p.currentStock <= p.minStockLevel;
                      return `
                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30">
                          <td class="px-4 py-3">
                            <div class="flex items-center gap-3">
                              <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 text-xs font-bold ${isLow ? 'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-400' : 'bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-400'}">${p.name.charAt(0)}</div>
                              <div class="min-w-0"><p class="font-medium text-gray-900 dark:text-white truncate">${p.name}</p><p class="text-xs text-gray-500 dark:text-gray-400">SKU: ${p.sku}</p></div>
                            </div>
                          </td>
                          <td class="px-4 py-3 hidden md:table-cell"><span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 rounded-md text-xs">${cat?.name || '—'}</span></td>

              <div class="px-4 py-3 border-t border-gray-100 dark:border-gray-800 text-xs text-gray-500 dark:text-gray-400">Showing ${filtered.length} of ${products.length} products</div>

    function renderCategories() {
      const categories = DB.get('categories');
      const search = state.search.toLowerCase();
      const filtered = categories.filter(c => c.name.toLowerCase().includes(search));

      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

              <input type="text" placeholder="Search categories..." value="${state.search}" oninput="state.search=this.value;render()" class="w-full pl-10 pr-4 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" />

              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">No categories found</h3>

                    <div class="flex items-center gap-3">

                      <div><h4 class="font-semibold text-gray-900 dark:text-white">${c.name}</h4>${c.description ? `<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5 line-clamp-2">${c.description}</p>` : ''}</div>

                      <button onclick="deleteCategory(${c.id})" class="p-1.5 text-gray-400 hover:text-red-600 dark:hover:text-red-400 rounded hover:bg-gray-100 dark:hover:bg-gray-800">${icons.trash}</button>

                </div>`).join('')}

    function renderTransactions(type) {
      const transactions = DB.get('transactions').filter(t => t.type === type);
      const products = DB.get('products');
      const parties = DB.get('parties');
      const partyType = type === 'received' ? 'supplier' : 'customer';
      const partyLabel = type === 'received' ? 'Supplier' : 'Customer';
      const title = type === 'received' ? 'Stock Received' : 'Stock Issued';
      const colorClass = type === 'received' ? 'green' : 'orange';

      const search = state.search.toLowerCase();
      const filtered = transactions.filter(t => {
        const prod = products.find(p => p.id === t.productId);
        const party = parties.find(p => p.id === t.partyId);
        return (prod?.name.toLowerCase().includes(search) || party?.name.toLowerCase().includes(search) || t.invoiceNumber?.toLowerCase().includes(search));
      }).sort((a, b) => b.date.localeCompare(a.date));

      const grandTotal = filtered.reduce((s, t) => s + t.totalAmount, 0);

      return `
        <div class="space-y-4">

            <div class="flex items-center justify-between">

              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">No ${title.toLowerCase()} records</h3>

            <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead><tr class="bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-800">

                    <th class="px-4 py-3 text-left font-semibold text-gray-600 dark:text-gray-400">Product</th>
                    <th class="px-4 py-3 text-left font-semibold text-gray-600 dark:text-gray-400 hidden md:table-cell">${partyLabel}</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400">Qty</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400 hidden sm:table-cell">Rate (₹)</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-600 dark:text-gray-400">Amount (₹)</th>

                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30">

                          <td class="px-4 py-3"><p class="font-medium text-gray-900 dark:text-white">${prod?.name || 'Unknown'}</p><p class="text-xs text-gray-500 dark:text-gray-400">${prod?.sku || ''}</p></td>

    function renderParties(type) {

      const labelPlural = type === 'supplier' ? 'Suppliers' : 'Customers';

      const search = state.search.toLowerCase();
      const filtered = parties.filter(p => p.name.toLowerCase().includes(search) || p.phone?.includes(search) || p.email?.toLowerCase().includes(search));

      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

              ${icons.search.replace('w-4 h-4', 'absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400')}
              <input type="text" placeholder="Search ${labelPlural.toLowerCase()}..." value="${state.search}" oninput="state.search=this.value;render()" class="w-full pl-10 pr-4 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" />
            </div>
            <button onclick="openModal('party-${type}')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium flex items-center gap-2 flex-shrink-0">${icons.plus} Add ${label}</button>

              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">No ${labelPlural.toLowerCase()} found</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              ${filtered.map(p => `
                <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-5 hover:shadow-md transition-shadow group">
                  <div class="flex items-start justify-between mb-3">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 text-sm font-bold bg-${colorClass}-100 dark:bg-${colorClass}-900/40 text-${colorClass}-700 dark:text-${colorClass}-400">${p.name.charAt(0).toUpperCase()}</div>

                    ${p.email ? `<div class="flex items-center gap-2 text-gray-600 dark:text-gray-400">${icons.email}<span class="truncate">${p.email}</span></div>` : ''}
                    ${p.address ? `<div class="flex items-start gap-2 text-gray-600 dark:text-gray-400">${icons.location}<span class="line-clamp-2">${p.address}</span></div>` : ''}

              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Purchase Price (₹)</label><input type="number" step="0.01" name="purchasePrice" value="${p.purchasePrice}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Selling Price (₹)</label><input type="number" step="0.01" name="sellingPrice" value="${p.sellingPrice}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium">${state.editing ? 'Save Changes' : 'Create Product'}</button>
            </div>
          </form>`;
      } else if (state.modal === 'category') {
        const c = state.editing || { name: '', description: '' };
        title = state.editing ? 'Edit Category' : 'Add New Category';
        content = `
          <form id="modalForm" onsubmit="saveCategory(event)" class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category Name *</label><input type="text" name="name" value="${c.name}" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label><textarea name="description" rows="3" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white resize-none">${c.description || ''}</textarea></div>
            <div class="flex justify-end gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium">${state.editing ? 'Save Changes' : 'Create Category'}</button>
            </div>
          </form>`;
      } else if (state.modal.startsWith('party-')) {
        const type = state.modal.replace('party-', '');
        const label = type === 'supplier' ? 'Supplier' : 'Customer';
        const p = state.editing || { name: '', phone: '', email: '', address: '', gst: '' };
        title = state.editing ? `Edit ${label}` : `Add New ${label}`;
        content = `
          <form id="modalForm" onsubmit="saveParty(event, '${type}')" class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${label} Name *</label><input type="text" name="name" value="${p.name}" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone</label><input type="text" name="phone" value="${p.phone || ''}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label><input type="email" name="email" value="${p.email || ''}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            </div>
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">GST Number</label><input type="text" name="gst" value="${p.gst || ''}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Address</label><textarea name="address" rows="2" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white resize-none">${p.address || ''}</textarea></div>
            <div class="flex justify-end gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium">${state.editing ? 'Save Changes' : `Add ${label}`}</button>
            </div>
          </form>`;
      } else if (state.modal.startsWith('transaction-')) {
        const type = state.modal.replace('transaction-', '');
        const partyType = type === 'received' ? 'supplier' : 'customer';
        const partyLabel = type === 'received' ? 'Supplier' : 'Customer';
        const colorClass = type === 'received' ? 'green' : 'orange';
        const products = DB.get('products');
        const parties = DB.get('parties').filter(p => p.type === partyType);
        const today = new Date().toISOString().split('T')[0];
        title = type === 'received' ? 'Record Purchase (Stock In)' : 'Record Sale (Stock Out)';
        content = `
          <form id="modalForm" onsubmit="saveTransaction(event, '${type}')" class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product *</label><select name="productId" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white"><option value="">Select Product</option>${products.map(p => `<option value="${p.id}">${p.name} (${p.sku})</option>`).join('')}</select></div>
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${partyLabel}</label><select name="partyId" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white"><option value="">Select ${partyLabel}</option>${parties.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantity *</label><input type="number" step="0.01" name="quantity" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Price per Unit (₹) *</label><input type="number" step="0.01" name="pricePerUnit" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date *</label><input type="date" name="date" value="${today}" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
              <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Invoice #</label><input type="text" name="invoiceNumber" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white" /></div>
            </div>
            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label><textarea name="notes" rows="2" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-white resize-none"></textarea></div>
            <div class="flex justify-end gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-${colorClass}-600 hover:bg-${colorClass}-700 text-white rounded-lg text-sm font-medium">${type === 'received' ? 'Record Purchase' : 'Record Sale'}</button>
            </div>
          </form>`;
      }

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" onclick="if(event.target===this)closeModal()">
          <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">${title}</h3>
              <button onclick="closeModal()" class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded">${icons.close}</button>
            </div>
            <div class="p-6">${content}</div>
          </div>
        </div>`;
    }

    function render() {
      const app = $('app');
      if (!state.user) {
        app.innerHTML = renderLogin();
        $('loginForm')?.addEventListener('submit', login);
      } else {
        let pageContent = '';
        switch (state.page) {
          case 'dashboard': pageContent = renderDashboard(); break;
          case 'products': pageContent = renderProducts(); break;
          case 'categories': pageContent = renderCategories(); break;
          case 'stock-in': pageContent = renderTransactions('received'); break;
          case 'stock-out': pageContent = renderTransactions('issued'); break;
          case 'suppliers': pageContent = renderParties('supplier'); break;
          case 'customers': pageContent = renderParties('customer'); break;
        }

        app.innerHTML = `
          <div class="min-h-screen flex bg-gray-50 dark:bg-gray-950">
            ${state.sidebarOpen ? '<div class="fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="toggleSidebar()"></div>' : ''}
            ${renderSidebar()}
            <main class="flex-1 min-w-0">
              ${renderTopBar()}
              <div class="p-4 lg:p-8">${pageContent}</div>
            </main>
          </div>
          ${renderModal()}
        `;
      }
    }

    // ============== ACTIONS ==============
    function login(e) {
      e.preventDefault();
      const email = $('loginEmail').value;
      const password = $('loginPassword').value;
      const users = DB.get('users');
      const user = users.find(u => u.email === email && u.password === password);
      if (user) {
        state.user = user;
        localStorage.setItem('sf_currentUser', JSON.stringify(user));
        render();
      } else {
        const err = $('loginError');
        err.textContent = 'Invalid email or password';
        err.classList.remove('hidden');
      }
    }

    function logout() {
      state.user = null;
      localStorage.removeItem('sf_currentUser');
      render();
    }

    function navigate(page) {
      state.page = page;
      state.search = '';
      state.catFilter = '';
      state.sidebarOpen = false;
      render();
    }

    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    }

    function toggleTheme() {
      state.dark = !state.dark;
      applyTheme();
      render();
    }

    function openModal(type) { state.modal = type; state.editing = null; render(); }
    function closeModal() { state.modal = null; state.editing = null; render(); }

    function editProduct(id) { state.editing = DB.get('products').find(p => p.id === id); state.modal = 'product'; render(); }
    function editCategory(id) { state.editing = DB.get('categories').find(c => c.id === id); state.modal = 'category'; render(); }
    function editParty(id) { const p = DB.get('parties').find(x => x.id === id); state.editing = p; state.modal = `party-${p.type}`; render(); }

    function saveProduct(e) {
      e.preventDefault();
      const form = new FormData(e.target);
      const products = DB.get('products');
      const data = {
        name: form.get('name'), sku: form.get('sku'), unit: form.get('unit'),
        categoryId: form.get('categoryId') ? parseInt(form.get('categoryId')) : null,
        minStockLevel: parseFloat(form.get('minStockLevel')) || 0,
        purchasePrice: parseFloat(form.get('purchasePrice')) || 0,
        sellingPrice: parseFloat(form.get('sellingPrice')) || 0
      };
      if (state.editing) {
        const idx = products.findIndex(p => p.id === state.editing.id);
        products[idx] = { ...products[idx], ...data };
      } else {
        products.push({ id: DB.getNextId('product'), ...data, currentStock: 0 });
      }
      DB.set('products', products);
      closeModal();
    }

    function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      DB.set('products', DB.get('products').filter(p => p.id !== id));
      render();
    }

    function saveCategory(e) {
      e.preventDefault();
      const form = new FormData(e.target);
      const categories = DB.get('categories');
      const data = { name: form.get('name'), description: form.get('description') };
      if (state.editing) {
        const idx = categories.findIndex(c => c.id === state.editing.id);
        categories[idx] = { ...categories[idx], ...data };
      } else {
        categories.push({ id: DB.getNextId('category'), ...data });
      }
      DB.set('categories', categories);
      closeModal();
    }

    function deleteCategory(id) {
      if (!confirm('Delete this category?')) return;
      DB.set('categories', DB.get('categories').filter(c => c.id !== id));
      render();
    }

    function saveParty(e, type) {
      e.preventDefault();
      const form = new FormData(e.target);
      const parties = DB.get('parties');
      const data = { name: form.get('name'), phone: form.get('phone'), email: form.get('email'), address: form.get('address'), gst: form.get('gst'), type };
      if (state.editing) {
        const idx = parties.findIndex(p => p.id === state.editing.id);
        parties[idx] = { ...parties[idx], ...data };
      } else {
        parties.push({ id: DB.getNextId('party'), ...data });
      }
      DB.set('parties', parties);
      closeModal();
    }

    function deleteParty(id) {
      if (!confirm('Delete this party?')) return;
      DB.set('parties', DB.get('parties').filter(p => p.id !== id));
      render();
    }

    function saveTransaction(e, type) {
      e.preventDefault();
      const form = new FormData(e.target);
      const transactions = DB.get('transactions');
      const products = DB.get('products');
      const qty = parseFloat(form.get('quantity'));
      const price = parseFloat(form.get('pricePerUnit'));
      const productId = parseInt(form.get('productId'));

      const txn = {
        id: DB.getNextId('transaction'), type, productId,
        partyId: form.get('partyId') ? parseInt(form.get('partyId')) : null,
        quantity: qty, pricePerUnit: price, totalAmount: qty * price,
        date: form.get('date'), invoiceNumber: form.get('invoiceNumber'), notes: form.get('notes')
      };
      transactions.push(txn);
      DB.set('transactions', transactions);

      // Update stock
      const prodIdx = products.findIndex(p => p.id === productId);
      if (prodIdx !== -1) {
        if (type === 'received') {
          products[prodIdx].currentStock += qty;
          products[prodIdx].purchasePrice = price;
        } else {
          products[prodIdx].currentStock -= qty;
          products[prodIdx].sellingPrice = price;
        }
        DB.set('products', products);
      }
      closeModal();
    }

    function deleteTransaction(id) {
      if (!confirm('Delete this transaction? Stock levels will be adjusted.')) return;
      const transactions = DB.get('transactions');
      const products = DB.get('products');
      const txn = transactions.find(t => t.id === id);
      if (txn) {
        const prodIdx = products.findIndex(p => p.id === txn.productId);
        if (prodIdx !== -1) {
          if (txn.type === 'received') products[prodIdx].currentStock -= txn.quantity;
          else products[prodIdx].currentStock += txn.quantity;
          DB.set('products', products);
        }
      }
      DB.set('transactions', transactions.filter(t => t.id !== id));
      render();
    }

    // ============== INIT ==============
    function init() {
      DB.init();
      const savedUser = localStorage.getItem('sf_currentUser');
      if (savedUser) state.user = JSON.parse(savedUser);
      applyTheme();
      render();
    }

    init();
  </script>
</body>
</html>
